<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Out of Bounds - Velocity</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --accent: #ff6a1a;
            --text-primary: #f0f0f0;
            --text-secondary: #b0b3c0;
            --transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Background Background */
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(255, 106, 26, 0.08) 0%, transparent 70%);
            z-index: 0;
            filter: blur(80px);
            animation: pulse Glow 8s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        .error-code {
            font-size: clamp(8rem, 25vw, 15rem);
            font-weight: 900;
            line-height: 0.8;
            margin-bottom: 2rem;
            background: linear-gradient(to bottom, #fff 40%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -10px;
            animation: slideUp 1s ease-out;
        }

        .status-msg {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: #fff;
            margin-bottom: 1rem;
            animation: fadeIn 1.2s ease-out;
        }

        .description {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 3rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
            animation: fadeIn 1.5s ease-out;
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            padding: 1.2rem 2.5rem;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            box-shadow: 0 15px 30px rgba(255, 106, 26, 0.2);
            animation: slideUp 1s ease-out 0.3s backwards;
        }

        .home-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: #ff8539;
            box-shadow: 0 20px 40px rgba(255, 106, 26, 0.4);
        }

        .home-btn i {
            transition: transform 0.3s ease;
        }

        .home-btn:hover i {
            transform: translateX(-5px);
        }

        /* Decorative Car Silhouette / Icon */
        .decor-icon {
            font-size: 3rem;
            color: rgba(255, 106, 26, 0.2);
            margin-bottom: 2rem;
            animation: drive 10s linear infinite;
        }

        @keyframes drive {
            0% { transform: translateX(-100vw); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(100vw); opacity: 0; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .error-code { letter-spacing: -5px; }
            .home-btn { width: 100%; justify-content: center; }
        }
    
        @media (max-width: 768px) {
            .footer-container {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .footer-col h4:after {
                left: 50%;
                transform: translateX(-50%);
            }
            .social-links {
                justify-content: center;
            }
            .newsletter-form {
                justify-content: center;
            }
        }

        /* responsive navbar */
        @media (max-width: 1024px) {
            .nav-container {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .nav-links {
                display: none;
            }
            .nav-actions .icon-btn,
            .nav-actions .rtl-btn,
            .nav-actions .login-btn {
                display: none;
            }
            .menu-toggle {
                display: flex;
            }
        }
        @media (max-width: 480px) {
            .brand-name {
                font-size: 1.2rem;
            }
            .demo-card h2 {
                font-size: 1.7rem;
            }
        }

        /* ----- MOBILE RESPONSIVENESS PATCH ----- */
        @media (max-width: 1199px) {
            .hero-title {
                font-size: 5rem;
            }
        }

        @media (max-width: 991px) {
            .hero-title {
                font-size: 4rem;
                line-height: 1.1;
            }
            .bento-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .innovation-split {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .stat-num {
                font-size: 4rem;
            }
        }

        @media (max-width: 768px) {
            :root {
                --section-padding: 3.5rem;
            }
            .hero-title {
                font-size: clamp(2.2rem, 10vw, 3.5rem);
                line-height: 1.1;
                margin-bottom: 1.5rem;
                letter-spacing: -1px;
            }
            .hero-subtitle {
                font-size: 0.75rem;
                letter-spacing: 4px;
                margin-bottom: 1rem;
            }
            .stat-num {
                font-size: 3rem;
            }
            .marquee-content {
                font-size: 2.5rem;
            }
            .bento-grid {
                grid-template-columns: 1fr;
            }
            .bento-1, .bento-2, .bento-3, .bento-4, .bento-5 {
                grid-column: span 1 !important;
            }
            .fleet-card {
                min-height: 380px;
            }
            .home-hero {
                height: auto;
                min-height: 100vh;
                padding: 100px 0 60px;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2.2rem;
            }
            .stat-num {
                font-size: 2.5rem;
            }
            .bento-item {
                padding: 1.5rem;
            }
            .fleet-content h3 {
                font-size: 1.5rem;
            }
        }
        /* ----- FULL MOBILE RESPONSIVENESS SUITE ----- */
        /* Prevent horizontal scrolling and force internal bounding */
        html, body {
            overflow-x: hidden;
            box-sizing: border-box;
            max-width: 100%;
        }

        img, video, canvas, svg {
            max-width: 100%;
            height: auto;
            box-sizing: border-box;
        }

        /* Breakpoint: 1024px */
        @media (max-width: 1024px) {
            section, .container, .bento-item, .fleet-card, .review-card, .showroom-bridge, .card, .box, div, p, h1, h2, h3, h4, h5, h6, a, span, button:not(.icon-btn):not(.rtl-btn):not(.menu-toggle) {
                box-sizing: border-box !important;
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
                white-space: normal !important;
            }
            .bento-item, .fleet-card, .review-card, .showroom-bridge {
                overflow: hidden !important;
                padding: 20px !important;
            }
            .home-section { overflow-x: hidden; box-sizing: border-box; max-width: 100%; }
            .home-container { box-sizing: border-box; max-width: 100%; padding: 0 1rem; }
            .bento-grid { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; box-sizing: border-box; max-width: 100%; }
            .bento-item { grid-column: span 2; box-sizing: border-box; max-width: 100%; }
            .bento-3, .bento-5 { grid-column: span 1; }
            .innovation-split { grid-template-columns: 1fr; gap: 4rem; box-sizing: border-box; max-width: 100%; }
            .hero-title { font-size: clamp(3rem, 10vw, 5rem); padding: 0 1rem; box-sizing: border-box; }
            .showroom-bridge { box-sizing: border-box; max-width: 100%; padding: 80px 2rem; text-align: center; margin: 0 auto 3rem; }
            .bridge-content { margin: 0 auto; box-sizing: border-box; max-width: 100%; }
            .marquee-content { font-size: 4rem; }
            .stats-inner { gap: 3rem; box-sizing: border-box; max-width: 100%; }
        }

        /* Breakpoint: 768px */
        @media (max-width: 768px) {
            .home-section { padding: 60px 1.2rem; box-sizing: border-box; max-width: 100%; }
            .fleet-grid { grid-template-columns: 1fr; gap: 2rem; box-sizing: border-box; max-width: 100%; }
            .fleet-card { height: 450px; box-sizing: border-box; max-width: 100%; margin: 0 auto; width: 100%; }
            .bento-grid { grid-template-columns: 1fr; gap: 1.2rem; }
            .bento-item { grid-column: span 1 !important; padding: 2rem; }
            .stats-strip { padding: 4rem 0; box-sizing: border-box; max-width: 100%; }
            .stats-inner { gap: 2rem; flex-direction: column; align-items: center; }
            .stat-num { font-size: 3.5rem; }
            .innovation-split { gap: 3rem; }
            .innov-img-box { border-radius: 30px; box-sizing: border-box; max-width: 100%; }
            #contactHome { grid-template-columns: 1fr !important; gap: 1rem; box-sizing: border-box; width: 100%; }
            #contactHome input, #contactHome button { grid-column: span 1 !important; box-sizing: border-box; width: 100%; }
            .review-grid { grid-template-columns: 1fr; gap: 2rem; box-sizing: border-box; max-width: 100%; }
            .review-card { padding: 2.5rem 1.5rem; box-sizing: border-box; max-width: 100%; margin: 0 auto; width: 100%; }
            .cta-btn { box-sizing: border-box; max-width: 100%; text-align: center; justify-content: center; }
        }

        /* Breakpoint: 480px */
        @media (max-width: 480px) {
            .hero-title { font-size: clamp(2rem, 8vw, 3.2rem); letter-spacing: -1px; margin-bottom: 1.5rem; }
            .hero-subtitle { letter-spacing: 2px; font-size: 0.8rem; padding: 0 0.5rem; box-sizing: border-box; }
            .cta-btn { width: 100%; justify-content: center; padding: 1rem 1.2rem; font-size: 0.9rem; box-sizing: border-box; }
            .fleet-content { padding: 1.5rem; box-sizing: border-box; width: 100%; }
            .fleet-content h3 { font-size: 1.4rem; }
            .marquee-content { font-size: 2.2rem; }
            .showroom-bridge { padding: 40px 1rem; border-radius: 20px; box-sizing: border-box; width: 100%; margin-bottom: 2rem; }
            .bento-item { padding: 1.5rem; border-radius: 24px; }
            .bento-item h3 { font-size: 1.3rem; }
            .review-card p { font-size: 1.05rem; }
            .stat-num { font-size: 2.8rem; }
        }

        /* Breakpoint: 320px */
        @media (max-width: 320px) {
            .hero-title { font-size: 1.8rem; letter-spacing: 0; }
            .bento-item { padding: 1.2rem; }
            .showroom-bridge { padding: 30px 0.8rem; }
            .cta-btn { padding: 0.8rem 1rem; font-size: 0.85rem; }
            .fleet-card { min-height: 380px; }
            .stat-num { font-size: 2.4rem; }
            .review-card { padding: 1.8rem 1.2rem; }
        }

    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <div class="container">
        <div class="decor-icon">
            <i class="fas fa-car-side"></i>
        </div>
        
        <h1 class="error-code">404</h1>
        <h2 class="status-msg">Lost the racing line?</h2>
        <p class="description">
            The page you're looking for has accelerated beyond our reach. Let's get you back to the main track.
        </p>
        
        <a href="index.html" class="home-btn">
            <i class="fas fa-arrow-left"></i> Return Home
        </a>
    </div>

    <!-- Small footer tag (inline, not the full footer) -->
    <div style="position: absolute; bottom: 2rem; width: 100%; text-align: center; color: rgba(255,255,255,0.2); font-size: 0.8rem; letter-spacing: 2px;">
        Â© VELOCITY MOTORS | ENGINEERED FOR EXCELLENCE
    </div>
</body>
</html>
